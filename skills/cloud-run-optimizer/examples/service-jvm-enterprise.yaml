# Optimized Cloud Run Service YAML — Profile G: Enterprise JVM & Managed Runtimes
# Ideal for: Spring Boot 3, Quarkus, Micronaut, ASP.NET Core
# Deploy with: gcloud run services replace service-jvm-enterprise.yaml --region=us-central1

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: jvm-spring-service
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Request-based billing for scale-to-zero compute
        run.googleapis.com/cpu-throttling: "true"
        # Startup CPU Boost is MANDATORY for JVM class-loading and JIT compilation
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "20"
    spec:
      containerConcurrency: 60
      timeoutSeconds: 60
      serviceAccountName: jvm-app-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/apps/spring-boot-app:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3

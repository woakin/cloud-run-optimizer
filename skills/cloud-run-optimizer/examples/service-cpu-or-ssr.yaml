# Optimized Cloud Run Service YAML — Profile B/C: SSR Web App or CPU-Bound API
# Ideal for: Next.js Standalone, Nuxt, Remix, Django/Flask WSGI, PDF/Image APIs
# Deploy with: gcloud run services replace service-cpu-or-ssr.yaml --region=us-central1

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: web-ssr-service
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Request-based billing keeps costs low during off-peak hours
        run.googleapis.com/cpu-throttling: "true"
        # Critical for SSR/Node/Python startup latency
        run.googleapis.com/startup-cpu-boost: "true"
        # Gen2 execution environment for faster CPU & Linux syscall performance
        run.googleapis.com/execution-environment: gen2
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "30"
    spec:
      # Moderate concurrency (set to 40-60 for Next.js SSR, or 4-8 for sync WSGI)
      containerConcurrency: 40
      timeoutSeconds: 60
      serviceAccountName: runtime-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/repo/web-ssr:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 15

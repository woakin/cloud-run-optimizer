# Optimized Cloud Run Service YAML — Profile A: I/O-Bound Async API
# Ideal for: Go, Rust, Node.js (Express/Fastify/Hono), Python (FastAPI/Uvicorn)
# Deploy with: gcloud run services replace service-io-bound.yaml --region=us-central1

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api-io-service
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # 1. Request-based billing: pay $0 for CPU when idle between requests
        run.googleapis.com/cpu-throttling: "true"
        # 2. Startup CPU Boost: accelerate cold starts at $0 idle cost
        run.googleapis.com/startup-cpu-boost: "true"
        # 3. Scale to zero when idle; cap max instances to protect DB connections
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "25"
        # 4. Optional Direct VPC Egress (replaces costly VPC Access Connectors):
        # run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
        # run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      # High concurrency for non-blocking I/O workloads
      containerConcurrency: 80
      timeoutSeconds: 60
      serviceAccountName: runtime-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/repo/app:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
